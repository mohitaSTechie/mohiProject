<main>
  <nav
    class="relative bg-gray-800/50 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10"
  >
    <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
      <div class="relative flex h-16 items-center justify-between">
        <!-- Mobile menu button -->
        <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
          <button
            type="button"
            (click)="mobileMenuOpen = !mobileMenuOpen"
            class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-2 focus:-outline-offset-1 focus:outline-indigo-500"
          >
            <span class="absolute -inset-0.5"></span>

            <span class="sr-only">
              {{ mobileMenuOpen ? 'Close main menu' : 'Open main menu' }}
            </span>

            @if (!mobileMenuOpen) {
              <!-- Hamburger icon -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                class="size-6"
                aria-hidden="true"
              >
                <path
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <!-- Close icon -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                class="size-6"
                aria-hidden="true"
              >
                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
          </button>
        </div>

        <!-- Logo + Desktop menu -->
        <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
          <!-- Logo -->
          <div class="flex shrink-0 items-center">
            <img
              src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
              alt="Company Logo"
              class="h-8 w-auto"
            />
          </div>

          <!-- Desktop navigation -->
          <div class="hidden sm:ml-6 sm:block">
            <div class="flex space-x-4">
              <!-- Home -->
              <button
                (click)="activeSection.set('home')"
                [ngClass]="
                  activeSection() === 'home'
                    ? 'bg-gray-950/50 text-white'
                    : 'text-gray-300 hover:bg-white/5 hover:text-white'
                "
                class="rounded-md px-3 py-2 text-sm font-medium"
              >
                Home
              </button>

              <!-- News -->
              <button
                (click)="activeSection.set('news')"
                [ngClass]="
                  activeSection() === 'news'
                    ? 'bg-gray-950/50 text-white'
                    : 'text-gray-300 hover:bg-white/5 hover:text-white'
                "
                class="rounded-md px-3 py-2 text-sm font-medium"
              >
                News
              </button>

              <!-- Profile -->
              <button
                (click)="activeSection.set('profile')"
                [ngClass]="
                  activeSection() === 'profile'
                    ? 'bg-gray-950/50 text-white'
                    : 'text-gray-300 hover:bg-white/5 hover:text-white'
                "
                class="rounded-md px-3 py-2 text-sm font-medium"
              >
                Profile
              </button>
            </div>
          </div>
        </div>

        <!-- Right side -->
        <div
          class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0"
        >
          <!-- Notification button -->
          <button
            type="button"
            class="relative rounded-full p-1 text-gray-400 hover:text-white focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500"
          >
            <span class="absolute -inset-1.5"></span>
            <span class="sr-only">View notifications</span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              class="size-6"
              aria-hidden="true"
            >
              <path
                d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <!-- Profile image -->
          <div class="relative ml-3">
            <button
              type="button"
              (click)="profileMenuOpen = !profileMenuOpen"
              class="relative flex rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
            >
              <span class="absolute -inset-1.5"></span>
              <span class="sr-only">Open user menu</span>

              <img
                src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
                alt="User profile"
                class="size-8 rounded-full bg-gray-800 outline -outline-offset-1 outline-white/10"
              />
            </button>

            <!-- Profile dropdown -->
            @if (profileMenuOpen) {
              <div
                class="absolute right-0 z-50 mt-2 w-48 origin-top-right rounded-md bg-gray-800 py-1 shadow-lg outline -outline-offset-1 outline-white/10"
              >
                <button
                  (click)="activeSection.set('profile'); profileMenuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5"
                >
                  Your profile
                </button>

                <button
                  (click)="profileMenuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5"
                >
                  Settings
                </button>

                <button
                  (click)="profileMenuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5"
                >
                  Sign out
                </button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile menu -->
    @if (mobileMenuOpen) {
      <div class="block sm:hidden">
        <div class="space-y-1 px-2 pt-2 pb-3">
          <button
            (click)="activeSection.set('home'); mobileMenuOpen = false"
            [ngClass]="
              activeSection() === 'home'
                ? 'bg-gray-950/50 text-white'
                : 'text-gray-300 hover:bg-white/5 hover:text-white'
            "
            class="block w-full text-left rounded-md px-3 py-2 text-base font-medium"
          >
            Home
          </button>

          <button
            (click)="activeSection.set('news'); mobileMenuOpen = false"
            [ngClass]="
              activeSection() === 'news'
                ? 'bg-gray-950/50 text-white'
                : 'text-gray-300 hover:bg-white/5 hover:text-white'
            "
            class="block w-full text-left rounded-md px-3 py-2 text-base font-medium"
          >
            News
          </button>

          <button
            (click)="activeSection.set('profile'); mobileMenuOpen = false"
            [ngClass]="
              activeSection() === 'profile'
                ? 'bg-gray-950/50 text-white'
                : 'text-gray-300 hover:bg-white/5 hover:text-white'
            "
            class="block w-full text-left rounded-md px-3 py-2 text-base font-medium"
          >
            Profile
          </button>
        </div>
      </div>
    }
  </nav>

  <!-- Current page renders here -->
  @if (activeSection() === 'home') {
    <app-home></app-home>
  }
  @if (activeSection() === 'news') {
    <app-news></app-news>
  }
  @if (activeSection() === 'profile') {
    <app-profile></app-profile>
  }
</main>
